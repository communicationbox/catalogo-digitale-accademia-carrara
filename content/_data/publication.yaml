contributor_as_it_appears:

contributor:
  - id: jkeller
    type: primary
    first_name: Paolo
    last_name: Plebani
    title: Conservatore di dipinti, disegni e stampe 
    affiliation: Accademia Carrara
    bio: "Storico dell’arte, è Conservatore di dipinti, disegni e stampe presso l’Accademia Carrara di Bergamo e professore a contratto di Museologia presso l’Università di Pavia. Si occupa prevalentemente di storia dell’arte lombarda e veneta del Cinquecento, di pittura e scultura dell’Ottocento, di museologia e di storia del collezionismo. Su questi temi ha pubblicato numerosi contributi all’interno di riviste specialistiche, cataloghi di mostre, atti di convegno e volumi miscellanei. In particolare, si segnalano la collaborazione alla catalogazione scientifica delle collezioni Borromeo all’Isola Bella (2011) il libro sulla fortuna dell’arte veronese nelle Vite di Giorgio Vasari (2012). Ha curato diverse mostre, tra cui quelle dedicate a Simone Peterzano (2020) e ai Tarocchi (2026)."

  - id: aallegri
    type: secondary
    first_name: Agostino
    last_name: Allegri
    bio: "Si è laureato presso l’Università degli Studi di Milano e ha conseguito il perfezionamento presso la Scuola Normale di Pisa. Ha lavorato, a vario titolo, a diversi progetti espositivi (Bernardino Luini e i suoi figli, 2014; Genovesino, 2017; Il Rinascimento di Gaudenzio Ferrari, 2018; Il Rinascimento nelle terre ticinesi 2, 2018; Vesperbild, 2018; Fede Galizia, mirabile pittoressa, 2021; I disegni del principe. La collezione di Alberico XII Barbiano di Belgioioso, 2022; Andrea Solario e il Rinascimento tra Italia e Francia, 2025). È conservatore presso Accademia Carrara, Bergamo."

  - id: abacchi
    type: secondary
    first_name: Andrea
    last_name: Bacchi
    title: Direttore
    affiliation: Fondazione Federico Zeri
    bio: "Insegna Storia dell’arte moderna all’Università di Bologna, dove dal 2014 dirige la Fondazione Federico Zeri. Dopo gli studi sulla pittura ferrarese del Rinascimento, si è occupato soprattutto di scultura, tanto del Rinascimento (a Trento nel 1999 ha curato la mostra La bellissima Maniera. Alessandro Vittoria e la scultura veneta del Cinquecento e nel 2008 Rinascimento e passione per l’antico. Andrea Riccio e il suo tempo), quanto del Barocco (del 1996 è il repertorio Scultura del ‘600 a Roma e del 2000 quello sulla Scultura a Venezia da Sansovino a Canova, entrambi con Susanna Zanuso). Molto numerosi, in particolare, i suoi contributi su Bernini, oggetto delle mostre curate al J. Paul Getty Museum di Los Angeles (2008), al Museo del Bargello di Firenze (2009), alla Galleria Borghese (2017) e a Palazzo Barberini (2026) a Roma."
    
  - id: ccollari
    type: secondary
    first_name: Claudio
    last_name: Collari
    bio: "Si è laureato in Arti visive all'Università di Bologna con una tesi sulla scultura a Bologna nella prima metà del Seicento. Tra il 2022 e il 2026 ha collaborato con la Fondazione Federico Zeri alla catalogazione della Fototeca Anna Ottani Cavina e dell’Archivio Adriano Cera, fondi fotografici riguardanti principalmente la pittura italiana tra il XVII e il XIX secolo. I suoi studi, in saggi e schede di catalogo, si sono concentrati soprattutto sulla scultura emiliana dal Rinascimento al Settecento. Recentemente ha anche partecipato al catalogo dei marmi della collezione G&R Etro (2026)."

  - id: dlipari
    type: secondary
    first_name: Davide
    last_name: Lipari
    bio: "Ha conseguito la laurea magistrale presso l’Università di Bologna con una tesi monografica dedicata ad Angelo Gabriello Piò e, nel 2025, il dottorato di ricerca presso la Sapienza Università di Roma con una tesi monografica su Ercole Ferrata. La sua attività di ricerca si concentra principalmente sulla scultura barocca emiliana e romana."
    
  - id: gmoscariello
    type: secondary
    first_name: Gerardo
    last_name: Moscariello
    bio: "Ha studiato Lettere moderne (2018) e Arti visive (2021) all’Università di Bologna, dove ha conseguito il dottorato (2025) sotto la guida di Andrea Bacchi, con una tesi su Pietro Tacca, cui dedica una monografia. Le sue ricerche riguardano prevalentemente la scultura fiorentina tra ultimo Cinquecento e primo Settecento (ma anche la quadratura emiliana, con attenzione alla scenografia teatrale settecentesca). Ha collaborato alla catalogazione di collezioni pubbliche e private, alla realizzazione di mostre e all’organizzazione di convegni internazionali. Nel 2024 è stato visiting scholar al Centro de Estudios del Museo del Prado di Madrid. Dal gennaio 2025 lavora con la galleria Walter Padovani di Milano, occupandosi di ricerca e progetti espositivi in Italia e all’estero."

  - id: gzaccariotto
    type: secondary
    first_name: Giulia
    last_name: Zaccariotto
    bio: "È stata curatrice delle collezioni di Scultura e Arti decorative dell’Accademia Carrara di Bergamo e dal 2023 è docente a contratto all’Università Ca’ Foscari di Venezia per gli insegnamenti di Storia dell’arte moderna. Dopo una prima formazione all’Università degli Studi di Milano, ha conseguito il dottorato presso la Scuola Normale Superiore di Pisa, dove è stata anche assegnista di ricerca. È specialista di scultura in bronzo in piccolo formato e ha seguito progetti di catalogazione presso la Galleria Giorgio Franchetti alla Ca’ d’Oro e la Galleria Estense. Ha approfondito i suoi temi di ricerca grazie a finanziamenti presso la Fondazione Federico di Zeri, la Fondazione Memofonte, il Getty Research Institute (LA) e l’Harvard Center for Renaissance Studies di Villa I Tatti. Negli ultimi anni ha aperto il suo lavoro a temi più generali dell’arte veneziana tra Quattro e Cinquecento, pittura, scultura e fonti manoscritte, nonché al rapporto tra testi classici e immagini. Nei suoi ultimi scritti ha pubblicato novità su Mantegna, Bellini, Tiziano e Giorgione."

  - id: lprincipi
    type: secondary
    first_name: Lorenzo
    last_name: Principi
    bio: "Si è formato presso l’Università degli Studi di Perugia e l’Università degli Studi di Genova, dove ha conseguito il titolo di Dottore di ricerca con una tesi sullo scultore toscano Silvio Cosini. Dopo un assegno di ricerca triennale presso l’Università degli Studi di Napoli “L’Orientale”, è attualmente assegnista presso il DHMoRe dell’Università degli Studi di Modena e Reggio Emilia. I suoi interessi sono principalmente rivolti verso la scultura italiana di età moderna, con particolare attenzione agli artisti dell’entourage di Michelangelo e all’influsso di Leonardo da Vinci."

  - id: lannibali
    type: secondary
    first_name: Luca
    last_name: Annibali
    bio: "Originario di Urbino, si è laureato all’Università di Bologna e ha poi conseguito un dottorato di ricerca alla Scuola Normale Superiore di Pisa, sotto la guida di Francesco Caglioti, e con un progetto sui figli di Antonio Lombardo, gli scultori cinquecenteschi Aurelio, Girolamo e Ludovico Lombardi. Gli interessi di Luca riguardano, più in generale, la scultura italiana del Cinquecento, da Venezia a Roma, da Firenze all’Emilia e alle Marche. È non meno l’autore di varie schede per cataloghi di collezioni pubbliche e private e per varie mostre. È stato assegnista di ricerca, tra il 2023 e il 2024, presso la Scuola Normale di Pisa, e dalla fine del 2024 ha un contratto di ricerca alla Scuola Universitaria della Svizzera Italiana di Mendrisio, entro il progetto del Fondo Nazionale Svizzero Building a Renaissance."

  - id: mscansani
    type: secondary
    first_name: Marco
    last_name: Scansani
    bio: "Laureato all’Università di Bologna e addottorato alla Scuola Normale Superiore di Pisa, è attualmente docente a contratto all’Università di Trento, dove è altresì assegnista di ricerca nel progetto C.Re.Te, dedicato alla mappatura della scultura rinascimentale in terracotta nell’Italia settentrionale. Ha inoltre collaborato alla catalogazione dei bronzetti del Museo Nazionale del Bargello. I suoi interessi di studio sono rivolti alla storia della scultura, in particolare a medaglistica e bronzistica in piccola scala, oltre che alla coroplastica, a cui ha dedicato il volume Il fuoco sacro della terracotta. Giovanni de Fondulis tra Lombardia e Veneto (2024)."

  - id: mlpacelli
    type: secondary
    first_name: Maria Luisa
    last_name: Pacelli
    bio: "Storica dell’arte, con oltre vent’anni di esperienza nella direzione e gestione di istituzioni museali. Attualmente è direttrice del Museo Accademia Carrara di Bergamo. Laureata all’Università Ca’ Foscari di Venezia, dal 2010 al 2019 ha diretto le Gallerie d’Arte Moderna e Contemporanea del Comune di Ferrara, ricoprendo in parallelo la carica di responsabile scientifica e organizzativa del programma espositivo della Fondazione Ferrara Arte; dal 2020 al 2024 ha diretto la Pinacoteca Nazionale di Bologna. Negli anni ha curato mostre, progetti e pubblicazioni, collaborando con importanti istituzioni museali nazionali e internazionali, tra cui la National Gallery di Londra, il Museo del Prado di Madrid, l’Ermitage di San Pietroburgo."

  - id: nciarlo
    type: secondary
    first_name: Nicola
    last_name: Ciarlo
    bio: "Si è formato presso l’Università degli Studi di Firenze dove ha conseguito anche il titolo di dottorato. La sua attività di ricerca verte sulla scultura barocca e tardobarocca tra Firenze, Roma e Napoli, temi sui quali ha all’attivo diverse pubblicazioni all’interno di miscellanee e riviste nazionali e internazionali come Nuovi Studi e The Burlington Magazine. Ha partecipato alla catalogazione della collezione di scultura di Gerolamo e Roberta Etro a Milano (2023; 2025) e al team che si è occupato del progetto di schedatura on-line delle opere di scultura del complesso Vittoriano e Palazzo Venezia di Roma (2025)."

  - id: rnaldi
    type: secondary
    first_name: Riccardo
    last_name: Naldi
    bio: "Insegna storia dell’arte moderna presso l’Università degli Studi di Napoli “L’Orientale”. Si occupa in particolare della produzione figurativa in Italia meridionale e delle sue relazioni artistiche con gli altri centri della penisola e la Spagna. A partire dalla drammatica esperienza del terremoto del 1980, ha affiancato all’attività di ricerca la collaborazione con gli enti di tutela, dedicandosi a opere e contesti a rischio per il degradato stato di conservazione."
    

