name: Deploy Pages

# Pubblica docs/ su GitHub Pages chiamando direttamente l'API di Pages.
# Rispetto ad actions/deploy-pages:
#  - non annulla la pubblicazione dopo 10 minuti: aspetta fino a 30;
#  - se un tentativo non va, crea da solo un commit di "sblocco" (cambia solo
#    docs/.nojekyll) e ripubblica con quel commit: GitHub blocca le nuove
#    pubblicazioni di un commit dopo un tentativo scaduto, e l'API accetta come
#    versione solo un commit esistente;
#  - se GitHub non prende in carico il tentativo (stato vuoto) per 5 minuti,
#    passa al successivo. Fino a 3 tentativi.
# Richiede Settings -> Pages -> Source: "GitHub Actions" e il dominio inserito
# in Settings -> Pages -> Custom domain (il file docs/CNAME qui non conta).
# Parte quando la build Quire termina con successo, a ogni modifica diretta
# di docs/ e manualmente da Actions -> Deploy Pages -> Run workflow.
on:
  workflow_run:
    workflows: [Quire]
    types: [completed]
    branches: [master]
  push:
    branches: [master]
    paths: ['docs/**']
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.base_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - id: pages
        uses: actions/configure-pages@v5
      - id: upload
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - name: Deploy to GitHub Pages
        uses: actions/github-script@v7
        env:
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact_id }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const artifact_id = Number(process.env.ARTIFACT_ID);
            const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
            const FAILED = ['deployment_failed', 'deployment_content_failed',
              'deployment_cancelled', 'deployment_lost', 'deployment_attempt_error'];
            const MAX_ATTEMPTS = 3, MAX_WAIT = 30 * 60e3, MAX_EMPTY = 5 * 60e3;
            if (!artifact_id) { core.setFailed('artifact_id mancante'); return; }

            // Commit di sblocco: alterna docs/.nojekyll vuoto / a capo.
            async function unblockCommit() {
              const { data } = await github.rest.repos.getContent({ owner, repo, path: 'docs/.nojekyll', ref: 'master' });
              const cur = Buffer.from(data.content || '', 'base64').toString();
              const res = await github.rest.repos.createOrUpdateFileContents({
                owner, repo, path: 'docs/.nojekyll', branch: 'master', sha: data.sha,
                message: 'Pages: nuova versione per sbloccare la pubblicazione [skip ci]',
                content: Buffer.from(cur === '' ? '\n' : '').toString('base64'),
              });
              return res.data.commit.sha;
            }

            let version = context.sha;
            for (let attempt = 1; attempt <= MAX_ATTEMPTS; attempt++) {
              if (attempt > 1) {
                try { version = await unblockCommit(); core.info(`Commit di sblocco ${version.slice(0, 8)}`); }
                catch (e) { core.warning(`Commit di sblocco non riuscito (${e.status} ${e.message})`); }
              }
              const oidc_token = await core.getIDToken();
              let id;
              try {
                const { data } = await github.request('POST /repos/{owner}/{repo}/pages/deployments',
                  { owner, repo, artifact_id, pages_build_version: version, oidc_token });
                id = data.id || version;
              } catch (e) {
                core.warning(`Tentativo ${attempt}: creazione fallita (${e.status} ${e.message})`);
                continue;
              }
              core.info(`Tentativo ${attempt}: deployment ${id} (versione ${version.slice(0, 8)})`);
              const start = Date.now();
              let status = '', last = null;
              while (Date.now() - start < MAX_WAIT) {
                await sleep(10e3);
                try {
                  status = (await github.request('GET /repos/{owner}/{repo}/pages/deployments/{id}',
                    { owner, repo, id })).data.status || '';
                } catch (e) { core.info(`lettura stato non riuscita: ${e.status}`); continue; }
                if (status !== last) {
                  core.info(`${Math.round((Date.now() - start) / 1000)}s stato: ${status || '(vuoto)'}`);
                  last = status;
                }
                if (status === 'succeed') { core.info('Pubblicazione riuscita'); return; }
                if (FAILED.includes(status)) break;
                if (!status && Date.now() - start > MAX_EMPTY) break;
              }
              core.warning(`Tentativo ${attempt} non riuscito (ultimo stato: ${status || 'vuoto'})`);
            }
            core.setFailed(`Pubblicazione non riuscita dopo ${MAX_ATTEMPTS} tentativi`);
