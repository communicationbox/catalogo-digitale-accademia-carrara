name: Deploy Pages

# Pubblica docs/ su GitHub Pages con actions/deploy-pages (timeout 30 min).
# Richiede Settings -> Pages -> Source: "GitHub Actions" e il dominio inserito
# in Settings -> Pages -> Custom domain (il file docs/CNAME qui non conta).
# Parte quando la build Quire termina con successo, a ogni modifica diretta
# di docs/ (es. CNAME) e manualmente da Actions -> Run workflow.
on:
  workflow_run:
    workflows: [Quire]
    types: [completed]
    branches: [master]
  push:
    branches: [master]
    paths: ['docs/**']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          timeout: 1800000
